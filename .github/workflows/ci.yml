name: CI

on:
  push:
    branches: [ main, release ]
  pull_request:
    branches: [ main, release ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Build
        run: yarn compile

      - name: Lint
        run: yarn tslint
